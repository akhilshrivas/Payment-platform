services:
  # Celery Worker
  - type: worker
    name: payment-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A config worker --loglevel=info --concurrency=4
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      # Add SECRET_KEY, RAZORPAY keys, and AI keys in the Render Dashboard

  # Celery Beat Scheduler
  - type: worker
    name: payment-celery-beat
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      # Add SECRET_KEY, RAZORPAY keys, and AI keys in the Render Dashboard

  # Django Web Service
  - type: web
    name: payment-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: payment-redis
          property: connectionString
      # Add SECRET_KEY, RAZORPAY keys, AI keys, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS in the Render Dashboard

databases:
  - name: payment-postgres
    databaseName: payment_platform
    user: payment_user
    plan: free

# Redis is natively supported by Render via external add-ons or manually adding a Redis instance
# The Redis service assumes you create it separately, or you can use a free Upstash Redis instance
