user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Production Server Configuration
    # Note: In a real production environment, you should configure SSL certificates here.
    # We listen on port 80 for HTTP and proxy, but you should terminate SSL and listen on 443.
    # See the "HTTPS Configuration" comment block below for instructions.
    
    server {
        listen 80;
        server_name _; # Replace with your production domain (e.g., app.yourdomain.com)

        # ----------------------------------------------------
        # Security Headers
        # ----------------------------------------------------
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ----------------------------------------------------
        # Static Frontend (React build)
        # ----------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            # Fallback to index.html for React Router
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            root /usr/share/nginx/html;
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }

        # ----------------------------------------------------
        # Django Backend API Proxy
        # ----------------------------------------------------
        location /api/ {
            proxy_pass http://backend:8000;
            
            # Forward real client IPs
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle Razorpay webhook payloads securely
            # Ensure the raw body is passed through unaltered for signature verification
            proxy_set_header Content-Length $content_length;
        }

        # ----------------------------------------------------
        # Django Static & Media Files
        # ----------------------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
        }
        
        # ----------------------------------------------------
        # HTTPS Configuration (Production)
        # ----------------------------------------------------
        # To enable HTTPS, uncomment the lines below and place your certs appropriately:
        # listen 443 ssl http2;
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
    }
}
